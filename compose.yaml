services:
  cloudguard:
    build: .
    container_name: cloudguard
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:h2:file:/app/data/cloudguard;DB_CLOSE_ON_EXIT=FALSE
    volumes:
      - cloudguard-data:/app/data
    restart: unless-stopped
volumes:
  cloudguard-data:
