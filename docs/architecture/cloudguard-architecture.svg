<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#101a30">CloudGuard — System Architecture</text>
  <text x="480" y="66" text-anchor="middle" font-size="12" fill="#6b7a90">CloudSim Plus simulation of computational task workloads and Token Bucket admission control</text>

  <!-- Browser SPA -->
  <rect x="40" y="110" width="220" height="90" rx="12" fill="#f5f7fb" stroke="#3768e8" stroke-width="2"/>
  <text x="150" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#18243a">Browser SPA</text>
  <text x="150" y="168" text-anchor="middle" font-size="11" fill="#55657d">Vanilla JS · HTML · CSS</text>
  <text x="150" y="185" text-anchor="middle" font-size="11" fill="#55657d">SVG analytics · CSV export</text>

  <!-- Spring Boot REST API -->
  <rect x="330" y="110" width="250" height="90" rx="12" fill="#f5f7fb" stroke="#3768e8" stroke-width="2"/>
  <text x="455" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#18243a">Spring Boot REST API</text>
  <text x="455" y="168" text-anchor="middle" font-size="11" fill="#55657d">ExperimentController</text>
  <text x="455" y="185" text-anchor="middle" font-size="11" fill="#55657d">/api/experiments · /run · /suite · export</text>

  <!-- CloudSim Plus engine -->
  <rect x="650" y="110" width="270" height="90" rx="12" fill="#eaf0ff" stroke="#3768e8" stroke-width="2"/>
  <text x="785" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#18243a">CloudSim Plus Engine</text>
  <text x="785" y="168" text-anchor="middle" font-size="11" fill="#55657d">CloudSimSimulationService</text>
  <text x="785" y="185" text-anchor="middle" font-size="11" fill="#55657d">Datacenter · Hosts · VMs · Cloudlets (SpaceShared)</text>

  <!-- Token Bucket -->
  <rect x="650" y="250" width="270" height="80" rx="12" fill="#e7f7f1" stroke="#1a9a70" stroke-width="2"/>
  <text x="785" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#16835e">Token Bucket — Admission</text>
  <text x="785" y="304" text-anchor="middle" font-size="11" fill="#55657d">deterministic pre-pass, before simulation.start()</text>
  <text x="785" y="320" text-anchor="middle" font-size="11" fill="#55657d">rejected tasks are never submitted</text>

  <!-- Metrics -->
  <rect x="330" y="250" width="250" height="80" rx="12" fill="#f1edff" stroke="#8058e8" stroke-width="2"/>
  <text x="455" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#5b3fd1">MetricsCalculator</text>
  <text x="455" y="304" text-anchor="middle" font-size="11" fill="#55657d">completion time · makespan · throughput</text>
  <text x="455" y="320" text-anchor="middle" font-size="11" fill="#55657d">mean · sample SD (n−1) · 95% CI</text>

  <!-- H2 DB -->
  <rect x="40" y="250" width="220" height="80" rx="12" fill="#fff4e8" stroke="#e99435" stroke-width="2"/>
  <text x="150" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#b87924">H2 File Database</text>
  <text x="150" y="304" text-anchor="middle" font-size="11" fill="#55657d">persists request + result JSON</text>
  <text x="150" y="320" text-anchor="middle" font-size="11" fill="#55657d">experiments table</text>

  <!-- arrows -->
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3768e8"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1a9a70"/></marker>
    <marker id="v" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8058e8"/></marker>
    <marker id="o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e99435"/></marker>
  </defs>
  <line x1="260" y1="155" x2="326" y2="155" stroke="#3768e8" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="293" y="146" text-anchor="middle" font-size="10" fill="#6b7a90">REST</text>
  <line x1="580" y1="155" x2="646" y2="155" stroke="#3768e8" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="785" y1="200" x2="785" y2="246" stroke="#1a9a70" stroke-width="2.2" marker-end="url(#g)"/>
  <line x1="455" y1="200" x2="455" y2="246" stroke="#8058e8" stroke-width="2.2" marker-end="url(#v)"/>
  <line x1="330" y1="290" x2="264" y2="290" stroke="#e99435" stroke-width="2.2" marker-end="url(#o)"/>
  <text x="297" y="281" text-anchor="middle" font-size="10" fill="#6b7a90">persist</text>

  <text x="480" y="400" text-anchor="middle" font-size="12" fill="#55657d">Flow: configure scenario → validate request → Token Bucket filters arrivals (rejected never submitted) →</text>
  <text x="480" y="420" text-anchor="middle" font-size="12" fill="#55657d">admitted Cloudlets run on VMs → metrics over completed tasks → persist to H2 → render SVG analytics.</text>
  <text x="480" y="470" text-anchor="middle" font-size="11" fill="#9aa6b8" font-style="italic">Simulation only — completion time is simulated Cloudlet finish − arrival time, not real network latency.</text>
</svg>
